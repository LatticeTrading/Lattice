[package]
name = "lattice"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1.0"
dirs = "6.0"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
